# PiVista TV optional remote support.
#
# OpenSSH is installed but the service is disabled until the user enables it
# from Settings > Remote support.  There is no root login and no interactive
# login for the kiosk user; only the dedicated, non-sudo `support` account is
# allowed.  Its password is generated on the television when SSH is enabled and
# is not present in the image.
PermitRootLogin no
PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AllowUsers support
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding local
GatewayPorts no
PermitTunnel no
MaxAuthTries 3
LoginGraceTime 20
ClientAliveInterval 300
ClientAliveCountMax 2
