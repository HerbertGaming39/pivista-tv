# PiVista TV logind policy.
[Login]
# The launcher owns the screen; logind must not start a text console there.
NAutoVTs=6
ReserveVT=6
# A short power-button press performs a clean shutdown; never suspend.
HandlePowerKey=poweroff
HandlePowerKeyLongPress=poweroff
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
IdleAction=ignore
